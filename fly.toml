# Cambia "agrocontrol-tu-nombre" por un nombre unico: fly apps create agrocontrol-tu-nombre
app = "agrocontrol-tu-nombre"
primary_region = "mia"

[build]

[env]
  PORT = "8080"
  AGROCONTROL_AUTO_SEED = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[mounts]]
  source = "agrocontrol_data"
  destination = "/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
